[project]
name = "rizify-workspace"
version = "0.2.0"
description = "Rizify Python workspace"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "acidify-core",
    "rizify",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["acidify-core", "rizify"]

[tool.uv.sources]
acidify-core = { workspace = true }
rizify = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "types-aiofiles>=24.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = ["acidify-core/src", "rizify/src"]
packages = ["acidify_core", "rizify"]
