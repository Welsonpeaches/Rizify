[project]
name = "acidify-core"
version = "0.2.0"
description = "Python protocol core based on Acidify"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Acidify contributors" }, { name = "Welsonpeaches" }]
dependencies = [
    "cryptography>=44.0.0",
    "httpx[http2]>=0.28.0",
]

[project.optional-dependencies]
media = ["pillow>=11.0", "pilk>=0.2.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acidify_core"]

[tool.hatch.build.targets.sdist]
include = ["src/acidify_core", "pyproject.toml"]
